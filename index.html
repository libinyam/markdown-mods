31v3h-31zM92 186h130v3h-130zM6 189h30v3h-30zM94 189h130v3h-130zM4 192h30v3h-30zM96 192h130v3h-130zM4 195h29v3h-29zM98 195h130v3h-130zM2 198h29v3h-29zM98 198h130v3h-130zM2 201h28v3h-28zM102 201h128v3h-128zM2 204h28v3h-28zM188 204h44v3h-44zM0 207h28v3h-28zM188 207h45v3h-45zM0 210h27v3h-27zM190 210h44v3h-44zM0 213h28v3h-28zM192 213h44v3h-44zM0 216h28v3h-28zM176 216h2v3h-2zM194 216h44v3h-44zM0 219h28v3h-28zM172 219h8v3h-8zM194 219h44v3h-44zM0 222h28v3h-28zM166 222h14v3h-14zM196 222h44v3h-44zM0 225h28v3h-28zM162 225h21v3h-21zM198 225h43v3h-43zM0 228h28v3h-28zM158 228h26v3h-26zM200 228h43v3h-43zM0 231h28v3h-28zM156 231h28v3h-28zM200 231h45v3h-45zM0 234h28v3h-28zM156 234h28v3h-28zM202 234h44v3h-44zM0 237h28v3h-28zM154 237h29v3h-29zM204 237h44v3h-44zM0 240h29v3h-29zM154 240h29v3h-29zM206 240h44v3h-44zM2 243h29v3h-29zM152 243h29v3h-29zM208 243h43v3h-43zM2 246h29v3h-29zM152 246h29v3h-29zM210 246h43v3h-43zM2 249h30v3h-30zM150 249h29v3h-29zM210 249h44v3h-44zM4 252h31v3h-31zM150 252h30v3h-30zM212 252h43v3h-43zM4 255h31v3h-31zM148 255h31v3h-31zM214 255h43v3h-43zM6 258h31v3h-31zM146 258h31v3h-31zM216 258h43v3h-43zM8 261h32v3h-32zM144 261h32v3h-32zM218 261h42v3h-42zM8 264h34v3h-34zM142 264h33v3h-33zM218 264h43v3h-43zM10 267h34v3h-34zM138 267h34v3h-34zM220 267h42v3h-42zM12 270h37v3h-37zM136 270h35v3h-35zM222 270h42v3h-42zM14 273h38v3h-38zM132 273h37v3h-37zM224 273h42v3h-42zM16 276h40v3h-40zM128 276h39v3h-39zM224 276h42v3h-42zM18 279h42v3h-42zM124 279h41v3h-41zM226 279h41v3h-41zM20 282h47v3h-47zM118 282h45v3h-45zM228 282h39v3h-39zM24 285h52v3h-52zM110 285h50v3h-50zM230 285h36v3h-36zM26 288h130v3h-130zM232 288h32v3h-32zM30 291h124v3h-124zM234 291h26v3h-26zM32 294h117v3h-117zM36 297h109v3h-109zM40 300h100v3h-100zM46 303h88v3h-88zM52 306h75v3h-75zM60 309h62v3h-62zM72 312h38v3h-38z"/></svg>'

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

// 语法与 md.doocs.org 一致：$..$  $$..$$  :::类型 标题 ... :::  ++引用++
marked.use({ extensions: [
  { name: 'mathBlock', level: 'block',
    start: s => s.match(/^\$\$/m)?.index,
    tokenizer(s) {
      const m = /^\$\$([\s\S]+?)\$\$[ \t]*(?:\n|$)/.exec(s)
      if (m) return { type: 'mathBlock', raw: m[0], text: m[1] }
    },
    renderer: t => `<section class="math" data-display="1">${esc(t.text)}</section>` },
  { name: 'math', level: 'inline',
    start: s => s.indexOf('$'),
    tokenizer(s) {
      const m = /^\$([^$\n]+?)\$/.exec(s)
      if (m) return { type: 'math', raw: m[0], text: m[1] }
    },
    renderer: t => `<span class="math">${esc(t.text)}</span>` },
  { name: 'ref', level: 'inline',
    start: s => s.indexOf('++'),
    tokenizer(s) {
      const m = /^\+\+([^+\n]+?)\+\+/.exec(s)
      if (m) return { type: 'ref', raw: m[0], tokens: this.lexer.inlineTokens(m[1]) }
    },
    renderer(t) { return `<span class="markup-underline">${this.parser.parseInline(t.tokens)}</span>` } },
  { name: 'box', level: 'block',
    start: s => s.match(/^:::/m)?.index,
    tokenizer(s) {
      const m = /^:::[ \t]*(\S+)[ \t]*([^\n]*)\n([\s\S]*?)\n:::[ \t]*(?:\n|$)/.exec(s)
      if (!m) return
      const t = { type: 'box', raw: m[0], kind: m[1], title: m[2].trim() || m[1], tokens: [] }
      this.lexer.blockTokens(m[3], t.tokens)
      return t
    },
    renderer(t) {
      const noNum = /!$/.test(t.kind)
      const kind = t.kind.replace(/!$/, '')
      return `<section class="markdown-alert markdown-alert-${esc(kind)}${noNum ? ' ma-nonum' : ''}"><p class="markdown-alert-title"><strong>${esc(t.title)}</strong></p>${this.parser.parse(t.tokens)}</section>`
    } },
]})

// 公式转 SVG，处理方式照搬 doocs，公众号能正常显示
function svg(tex, display) {
  MathJax.texReset()
  const el = MathJax.tex2svg(tex, { display }).firstElementChild
  el.style.width = el.getAttribute('width')
  el.removeAttribute('width')
  el.style.display = 'initial'
  el.style.setProperty('max-width', '300vw', 'important')
  el.querySelector('g')?.setAttribute('fill', 'currentColor')
  return el.outerHTML
}

const rules = [...document.getElementById('theme').sheet.cssRules]
const src = document.getElementById('src'), view = document.getElementById('view')

// 计数器：按一级标题分组，所有卡片共享一个序列，证明不占号
// 没有一级标题的稿子保留手写编号；正文 ++…++ 里的旧编号换成新编号
function numbering(root = view) {
  if (!root.querySelector(':scope > h1')) return
  let sec = 0, cnt = 0
  const map = {}
  for (const el of root.children) {
    if (el.tagName === 'H1') {
      sec++; cnt = 0
      const em = el.querySelector('em')
      if (em) em.textContent = String(sec)
      continue
    }
    if (!el.classList.contains('markdown-alert')) continue
    if (el.classList.contains('markdown-alert-proof')) continue
    if (el.classList.contains('ma-nonum')) continue
    cnt++
    const t = el.querySelector('.markdown-alert-title')
    if (!t) continue
    const s = t.querySelector('strong') || t
    const num = (sec || 1) + '.' + cnt
    const old = /\d+\s*[.．]\s*\d+/.exec(s.textContent)
    if (old) map[old[0]] ??= num
    const raw = s.textContent.replace(/\d+\s*[.．]\s*\d+/g, ' ').replace(/\s+/g, ' ').trim()
    const i = raw.search(/[（(]/)
    const head = i < 0 ? raw : raw.slice(0, i).trim()
    const tail = i < 0 ? '' : raw.slice(i)
    s.textContent = head + ' ' + num + tail
  }
  root.querySelectorAll('.markup-underline').forEach(u => {
    for (const n of u.childNodes) if (n.nodeType === 3) n.data = n.data.replace(/\d+\s*[.．]\s*\d+/g, k => map[k] || k)
  })
}

// 一级标题内部拆成三段 inline-block：左图标 / 居中标题 / 右图标。
// 不用 table：微信编辑器会重建表格（加边框、把编号和标题拆成两行）。
// 不用 position/float/flex：微信会剥掉，图标退回文字旁边。
function layoutHeadings() {
  const CELL = 'display:inline-block;vertical-align:middle;'
  view.querySelectorAll('h1').forEach(h => {
    const c = h.cloneNode(true)
    const found = [...c.querySelectorAll(':scope > svg')]   // 公式的 svg 包在 span 里，不算图标
    found.forEach(s => s.remove())
    const L = found[0] ? found[0].outerHTML.replace(/ style="[^"]*"/, '') : WHEEL
    const R = found[1] ? found[1].outerHTML.replace(/ style="[^"]*"/, '') : WHEEL
    const mid = c.innerHTML.trim()
    h.innerHTML =
      '<span style="' + CELL + 'width:10%;text-align:left">' + L + '</span>' +
      '<span style="' + CELL + 'width:80%;text-align:center">' + mid + '</span>' +
      '<span style="' + CELL + 'width:10%;text-align:right">' + R + '</span>'
  })
}

// 超链接 → 脚注
// 微信会把 <a> 剥掉，只留下文字和一段裸 URL（就成了"博客(https://…)"那种残骸）。
// 所以正文里只留「文字[1]」，所有地址统一收到文末的「参考资料」。
function footnotes() {
  const as = [...view.querySelectorAll('a[href]')]
  if (!as.length) return

  const refs = []
  as.forEach((a, i) => {
    const n = i + 1
    refs.push({ n: n, href: a.getAttribute('href') })
    const sup = document.createElement('sup')
    sup.setAttribute('style', 'font-size:11px;line-height:0;color:#2f8f8f;vertical-align:3px;')
    sup.textContent = '[' + n + ']'
    a.replaceWith(document.createTextNode(a.textContent), sup)
  })

  const F = 'font-family:"Source Han Serif SC","Noto Serif SC","Songti SC",STSong,SimSun,serif;'

  const h = document.createElement('h2')
  h.setAttribute('style', 'margin:2.6em 0 1em;padding:0;border:0;font-size:20px;font-weight:bold;line-height:1.5;color:#1f1f1f;font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;')
  h.textContent = '参考资料'
  view.appendChild(h)

  refs.forEach(r => {
    const p = document.createElement('p')
    p.setAttribute('style', 'margin:0 0 8px;font-size:14px;line-height:1.95;color:#1f1f1f;' + F)
    p.innerHTML = '<span style="color:#a3a3a3">[' + r.n + ']</span>　　链接：' +
                  '<span style="font-style:italic;color:#6f6f6f">' + esc(r.href) + '</span>'
    view.appendChild(p)
  })
}

function render() {
  view.innerHTML = marked.parse(src.value)
  view.querySelectorAll('.math').forEach(m => {
    m.outerHTML = m.dataset.display
      ? `<section style="margin:1em 0;text-align:center;overflow-x:auto">${svg(m.textContent, true)}</section>`
      : `<span>${svg(m.textContent, false)}</span>`
  })
  numbering()
  // 按源码顺序写进 style 属性，后写的覆盖先写的
  for (const r of rules) view.querySelectorAll(r.selectorText).forEach(el => { el.style.cssText += r.style.cssText })
  footnotes()
  layoutHeadings()
}

// 知乎会过滤所有样式，只保留结构；公式换成知乎自己的公式图片，行间公式末尾加 \\
function zhihu() {
  const body = document.implementation.createHTMLDocument('').body
  body.innerHTML = marked.parse(src.value)
  body.querySelectorAll('.math').forEach(m => {
    const tex = m.textContent.trim() + (m.dataset.display ? '\\\\' : '')
    const img = body.ownerDocument.createElement('img')
    img.setAttribute('eeimg', '1')
    img.setAttribute('src', 'https://www.zhihu.com/equation?tex=' + encodeURIComponent(tex))
    img.setAttribute('alt', tex)
    if (m.dataset.display) { const p = body.ownerDocument.createElement('p'); p.append(img); m.replaceWith(p) }
    else m.replaceWith(img)
  })
  numbering(body)
  // 知乎不认 section，卡片换回引用块
  body.querySelectorAll('section.markdown-alert').forEach(s => {
    const q = body.ownerDocument.createElement('blockquote')
    q.append(...s.childNodes)
    s.replaceWith(q)
  })
  body.querySelectorAll('h1 em, h2 em').forEach(e => e.replaceWith(e.textContent))
  return body.innerHTML
}

function copy(html, label) {
  document.addEventListener('copy', e => {
    e.clipboardData.setData('text/html', html)
    e.clipboardData.setData('text/plain', src.value)
    e.preventDefault()
  }, { once: true })
  document.execCommand('copy')
  const msg = document.getElementById('msg')
  msg.textContent = `已复制，去${label}编辑器粘贴`
  setTimeout(() => msg.textContent = '', 3000)
}

const KIND = {
  定理: 'theorem', 命题: 'proposition', 引理: 'lemma', 推论: 'corollary',
  结论: 'corollary', 定义: 'definition', 公理: 'axiom', 事实: 'fact',
  评注: 'remark', 注: 'remark', 例子: 'example', 例: 'example', 习题: 'example',
  问题: 'question', 疑问: 'question'
}

// 旧稿 → 本编辑器语法
// 旧稿（markdown-writing-style）：定理/定义等写成 「> **定理** 正文」引用块，
// 块内行间公式独占一行（可能写成 ">$$…$$"），证明是块外普通正文、以 $\square$ 收尾，
// 标题用 #/##/### 且不带编号，原样保留。
// 没有可转换的块时原文返回，所以对 ::: 稿子是空操作。
function convertLegacy(text) {
  const lines = text.replace(/\r\n?/g, '\n').split('\n')
  const out = []
  let i = 0, hits = 0

  while (i < lines.length) {
    const line = lines[i]

    if (/^>/.test(line)) {
      const raw = [], buf = []
      while (i < lines.length && /^>/.test(lines[i])) {
        raw.push(lines[i])
        buf.push(lines[i].replace(/^>[ \t]?/, ''))
        i++
      }
      const m = /^\*\*([^*]+?)\*\*[ \t]*([\s\S]*)$/.exec(buf[0] || '')
      // 加粗里可能带编号或副标题：「例 1」「定理（Chevalley）」「引理的证明」
      let key = m ? m[1].trim() : ''
      let sub = ''
      const pm0 = /[（(]/.exec(key)
      if (pm0) { sub = key.slice(pm0.index).trim(); key = key.slice(0, pm0.index).trim() }
      key = key.replace(/[\s\d.：:]+$/, '').trim()
      // 容错：卡片与它的行间公式之间被真空行（而不是 ">"）隔开时，
      // 把后续那段"首行不是 **词**"的引用块并回同一张卡片。
      if (key && KIND[key]) {
        for (;;) {
          let k = i
          while (k < lines.length && lines[k].trim() === '') k++
          if (k < lines.length && /^>/.test(lines[k]) &&
              !/^\*\*[^*]+?\*\*/.test(lines[k].replace(/^>[ \t]?/, ''))) {
            if (buf.length && buf[buf.length - 1].trim() !== '') buf.push('')
            while (k < lines.length && /^>/.test(lines[k])) {
              buf.push(lines[k].replace(/^>[ \t]?/, ''))
              k++
            }
            i = k
          } else break
        }
      }
      while (buf.length && !buf[0].trim()) buf.shift()
      while (buf.length && !buf[buf.length - 1].trim()) buf.pop()

      let rest = m ? m[2].trim() : ''
      // 加粗外紧跟的副标题：「**定理**（Chevalley）设 …」
      if (!sub && /^[（(][^）)]{1,40}[）)]/.test(rest)) {
        const pm1 = /^[（(][^）)]{1,40}[）)]/.exec(rest)
        sub = pm1[0]
        rest = rest.slice(sub.length).trim()
      }
      const isProof = /证明$/.test(key)
      if (isProof || (key && KIND[key])) {
        hits++
        out.push(':::' + (isProof ? 'proof' : KIND[key]) + ' ' + key + sub)
        if (rest) out.push(rest)
        for (const b of buf.slice(1)) out.push(b)
        out.push(':::')
      } else {
        for (const r of raw) out.push(r)   // 不是卡片，原样保留
      }
      out.push('')
      continue
    }

    const pm = /^\*\*([^*]*证明)[：:]?\*\*[ \t]*[：:]?[ \t]*(.*)$/.exec(line)
    if (pm) {
      hits++
      out.push(':::proof ' + pm[1].trim())
      const first = pm[2].trim()
      if (first) out.push(first)
      i++
      const done = first.indexOf('$\\square$') >= 0
      while (!done && i < lines.length) {
        const L = lines[i]
        if (/^#{1,6}[ \t]/.test(L) || /^>/.test(L) || /^:::/.test(L)) break
        if (L.indexOf('$\\square$') >= 0) { if (L.trim()) out.push(L); i++; break }
        out.push(L)
        i++
      }
      while (out.length && out[out.length - 1].trim() === '') out.pop()
      out.push(':::', '')
      continue
    }

    out.push(line)
    i++
  }

  if (!hits) return text
  const res = []
  for (const l of out) if (!(l === '' && res[res.length - 1] === '')) res.push(l)
  return res.join('\n').trim() + '\n'
}

// 纯文本稿 → 本编辑器语法
// 从网页、文档里复制出来的稿子丢了 # 和 **，只剩一段段纯文本，按段落的样子猜结构：
//   「第2章 …」→ 一级标题；「2.1 …」→ 二级标题；没有句末标点的短段 → 加粗小标题；
//   「定义 2.3（…）…」→ 卡片，连同紧跟的行间公式；「证明 …」→ 证明卡片，到 □ / 证毕为止；
//   以「；」分隔的连续段落 → 列表；正文里的「定理 2.3」→ ++定理 2.3++。
// 卡片类型带 !，保留稿子自己的编号。已有 Markdown 结构的段落（#、>、列表、:::、```、$$）
// 原样保留，所以点多次不会重复转换。
function convertPlain(text) {
  const L = text.replace(/\r\n?/g, '\n').split('\n')
  // 按空行切段；```…```、:::…:::、跨行的 $$…$$ 整块算一段
  const paras = []
  for (let i = 0; i < L.length;) {
    if (!L[i].trim()) { i++; continue }
    const close = /^```/.test(L[i]) ? /^```/ : /^:::\s*\S/.test(L[i]) ? /^:::\s*$/
      : /^\$\$/.test(L[i]) && !/\S\$\$\s*$/.test(L[i]) ? /\$\$\s*$/ : null
    let k = i + 1
    if (close) { while (k < L.length && !close.test(L[k])) k++; k++ }
    else while (k < L.length && L[k].trim() && !/^(```|:::|\$\$)/.test(L[k])) k++
    paras.push(L.slice(i, k).join('\n'))
    i = k
  }

  const isTitle = p => !p.includes('\n') && p.length <= 60 &&
    !/[。．.，,：:；;！!？?、…]$/.test(p) && !/^([\s#>*+\-|<!\[$`:]|\d+[.)]\s)/.test(p)
  const heading = p => {
    if (!isTitle(p)) return null
    if (/^第\s*[\d一二三四五六七八九十百零]+\s*[章部篇]/.test(p)) return '# ' + p
    const m = /^(\d+(?:\.\d+)+)\s*([^\d\s.].*)$/.exec(p)
    return m ? '## *' + m[1] + '* ' + m[2] : null
  }
  const KEY = new RegExp('^(证明(?:思路|要点|概要)?|' + Object.keys(KIND).sort((a, b) => b.length - a.length).join('|') +
    ')(\\s*\\d+(?:[.．]\\d+)*)?\\s*([（(][^）)\\n]{0,40}[）)])?\\s*([：:.．。]?)\\s*')
  const head = p => {
    // 「**定理 1.1**（…）设 …」：去掉加粗再认，加粗的部分必须整个是标题（「**定义域**」不算）
    const b = /^\*\*([^*\n]+)\*\*/.exec(p)
    if (b) p = b[1] + p.slice(b[0].length)
    const m = KEY.exec(p)
    if (!m || (b ? m[0].length < b[1].length : !(m[2] || m[3] || m[4] || m[0].length === p.length))) return null   // 「注意」「定义域」不算
    return { kind: KIND[m[1]] || 'proof', title: m[0].replace(/[\s：:.．。]+$/, ''), rest: p.slice(m[0].length) }
  }
  const stop = p => head(p) || heading(p) || /^(#|:::|```)/.test(p)
  const END = /□|∎|\\square|\\blacksquare|\\Box|证毕/
  // 段落（或公式）以句号收尾，陈述才算说完；行末的 \tag{2.4}、(2.9) 这类编号不算
  const ended = p => /[。．.！!？?]$/.test(p.replace(/\$\$\s*$/, '').replace(/\\tag\{[^}]*\}/g, '').trim()
    .replace(/\s*[（(][\d.]+[）)]$/, ''))
  let hits = 0

  // 正文里的「定理 2.3」包上 ++ 变成引用；跳过已有的 ++…++、公式和行内代码。
  // 单字的「注」「例」不认，太容易误伤（备注 1、比例 2）
  const REF = new RegExp('(\\+\\+[^+\\n]*\\+\\+|\\$\\$[\\s\\S]*?\\$\\$|\\$[^$\\n]*\\$|`[^`\\n]*`)|((?:' +
    Object.keys(KIND).filter(k => k.length > 1).join('|') + ')\\s*\\d+(?:[.．]\\d+)*)', 'g')
  const refs = s => s.replace(REF, (m, skip, ref) => skip ? m : (hits++, '++' + ref + '++'))

  // 以「；」结尾的段落和后面的段落是并列条目（最后一条以句号结尾），合成一个列表；
  // 每条都以（1）、1）、① 这类序号开头时用有序列表
  const item = p => !stop(p) && !/^([\s#>*+\-|<!\[$`]|\d+[.)]\s)/.test(p)
  const ENUM = /^(?:[（(]\d+[）)]|\d+[）)、]|[①-⑳])\s*/
  for (let i = 0; i < paras.length; i++) {
    let k = i
    while (k + 1 < paras.length && /[；;]$/.test(paras[k]) && item(paras[k]) && item(paras[k + 1])) k++
    if (k === i) continue
    const items = paras.slice(i, k + 1)
    const ordered = items.every(p => ENUM.test(p))
    paras.splice(i, items.length, items.map((p, n) => ordered ? n + 1 + '. ' + p.replace(ENUM, '') : '- ' + p).join('\n'))
    hits++
  }

  const out = []
  for (let i = 0; i < paras.length; i++) {
    const p = paras[i], h = head(p)
    if (!h) {
      const t = heading(p)
      if (t) { hits++; out.push(t) }
      else if (/^(#|```)/.test(p)) out.push(p)
      else if (/^:::/.test(p)) { const n = p.indexOf('\n'); out.push(p.slice(0, n) + refs(p.slice(n))) }   // 卡片标题行不加 ++
      else if (isTitle(p)) { hits++; out.push('**' + refs(p) + '**') }
      else out.push(refs(p))
      continue
    }
    hits++
    const body = h.rest ? [h.rest] : []
    const next = () => i + 1 < paras.length && !stop(paras[i + 1])
    if (h.kind === 'proof') {
      while (!END.test(body.join('\n')) && next()) body.push(paras[++i])
    } else {
      // 标题单独一行、「则：」后的列表、公式后接着的半句，都收进卡片
      while (!(body.length && ended(body[body.length - 1])) && next()) body.push(paras[++i])
      while (i + 1 < paras.length && /^\$\$/.test(paras[i + 1])) body.push(paras[++i])
    }
    out.push(':::' + h.kind + (h.kind === 'proof' ? ' ' : '! ') + h.title + '\n' + body.map(refs).join('\n\n') + '\n:::')
  }
  return hits ? out.join('\n\n') + '\n' : text
}

document.getElementById('conv').onclick = () => {
  const before = src.value
  const after = convertPlain(convertLegacy(before))
  const msg = document.getElementById('msg')
  if (before === after) { msg.textContent = '没有识别到可转换的结构'; return }
  // 用 insertText 替换全文，Ctrl+Z 能撤回；会触发 input，照常渲染和存草稿
  src.focus()
  src.select()
  document.execCommand('insertText', false, after)
  msg.textContent = '已应用主题，不满意可以 Ctrl+Z 撤销'
}

document.getElementById('zh').onclick = () => copy(zhihu(), '知乎')
